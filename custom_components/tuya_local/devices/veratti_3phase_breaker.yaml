name: Circuit breaker
products:
  - id: zxhlsbmhkauiyget
    manufacturer: VERATTI
    model: V4 3-phase circuit breaker
entities:
  - entity: switch
    dps:
      - id: 16
        type: boolean
        name: switch

  - entity: sensor
    translation_key: energy_consumed
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100

  - entity: sensor
    translation_key: energy_produced
    class: energy
    dps:
